<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MA Railway Mileposts</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html,
    body,
    #map {
      height: 100%;
      margin: 0;
    }

    .layer-panel,
    .info-panel {
      background: #fff;
      border: 1px solid #cfd7df;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.16);
      color: #1d2730;
      font: 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 10px 12px;
    }

    .layer-panel {
      max-height: min(70vh, 560px);
      overflow: auto;
    }

    .info-panel {
      max-width: 360px;
    }

    .panel-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .panel-text {
      margin: 0 0 8px;
    }

    .panel-footer {
      border-top: 1px solid #e2e8ef;
      color: #4c5967;
      font-size: 12px;
      padding-top: 7px;
    }

    .layer-row {
      align-items: center;
      display: flex;
      gap: 8px;
      margin-top: 4px;
      min-width: 230px;
    }

    .layer-row input {
      margin: 0;
    }

    .layer-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend-swatch {
      border-radius: 999px;
      display: inline-block;
      height: 10px;
      width: 10px;
    }

    .legend-line {
      border-radius: 2px;
      display: inline-block;
      height: 4px;
      width: 20px;
    }

    .loading {
      background: #fff;
      border: 1px solid #cfd7df;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.16);
      color: #1d2730;
      font: 13px/1.35 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 8px 10px;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
  <script>
    const map = L.map('map', {
      preferCanvas: true
    }).setView([42.28, -72.62], 12);

    map.createPane('milepostPane');
    map.getPane('milepostPane').style.zIndex = 670;
    map.getPane('tooltipPane').style.zIndex = 700;

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const allBounds = L.latLngBounds();
    const layerItems = [];
    const milepostMarkers = [];
    const trackColors = [
      '#0072b2',
      '#009e73',
      '#d55e00',
      '#cc79a7',
      '#56b4e9',
      '#e69f00',
      '#6f4e7c',
      '#4e79a7',
      '#59a14f',
      '#9c755f',
      '#f28e2b'
    ];
    const status = L.control({ position: 'topright' });

    status.onAdd = function () {
      const div = L.DomUtil.create('div', 'loading');
      div.textContent = 'Loading railway data...';
      return div;
    };
    status.addTo(map);

    function extendBounds(layer) {
      if (layer.getBounds) {
        const bounds = layer.getBounds();
        if (bounds.isValid()) allBounds.extend(bounds);
      } else if (layer.getLatLng) {
        allBounds.extend(layer.getLatLng());
      }
    }

    function fitToData() {
      if (allBounds.isValid()) {
        map.fitBounds(allBounds.pad(0.08));
      }
    }

    function parseMarkerText(text) {
      return text
        .trim()
        .split(/\r?\n/)
        .slice(1)
        .map((line) => line.split(',').map((value) => value.trim()))
        .map(([imageFile, lat, lon, ele, time]) => ({
          imageFile,
          lat: Number(lat),
          lon: Number(lon),
          ele: Number(ele),
          time
        }))
        .filter((row) => Number.isFinite(row.lat) && Number.isFinite(row.lon));
    }

    function firstElementText(parent, tagName) {
      const element = parent.getElementsByTagNameNS('*', tagName)[0];
      return element ? element.textContent.trim() : '';
    }

    function parseKmlPointPlacemarks(kmlText) {
      const xml = new DOMParser().parseFromString(kmlText, 'application/xml');
      const parserError = xml.getElementsByTagName('parsererror')[0];

      if (parserError) {
        throw new Error('Could not parse KML inside Mile_Posts.kmz');
      }

      return Array.from(xml.getElementsByTagNameNS('*', 'Placemark'))
        .map((placemark) => {
          const point = placemark.getElementsByTagNameNS('*', 'Point')[0];
          const coordinates = point ? firstElementText(point, 'coordinates') : '';
          const [lon, lat, ele] = coordinates.split(',').map(Number);

          return {
            name: firstElementText(placemark, 'name') || 'Mile post',
            description: firstElementText(placemark, 'description'),
            lat,
            lon,
            ele
          };
        })
        .filter((row) => Number.isFinite(row.lat) && Number.isFinite(row.lon));
    }

    async function loadMilePostsKmz(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Could not load ${url}: ${response.status}`);
      }

      const zip = await JSZip.loadAsync(await response.arrayBuffer());
      const kmlFile = Object.values(zip.files).find((file) => file.name.toLowerCase().endsWith('.kml'));

      if (!kmlFile) {
        throw new Error('Mile_Posts.kmz does not contain a KML file');
      }

      const milePosts = parseKmlPointPlacemarks(await kmlFile.async('text'));
      const group = L.layerGroup();

      milePosts.forEach((post) => {
        const marker = L.circleMarker([post.lat, post.lon], {
          pane: 'milepostPane',
          color: '#8a2be2',
          fillColor: '#ffeb3b',
          fillOpacity: 0.95,
          radius: 7,
          weight: 3
        });

        marker.bindTooltip(post.name, {
          direction: 'top',
          opacity: 0.9,
          sticky: true
        });

        marker.bindPopup(`
          <strong>${post.name}</strong><br>
          ${post.lat.toFixed(7)}, ${post.lon.toFixed(7)}<br>
          <a href="https://www.google.com/maps/search/?api=1&query=${post.lat},${post.lon}" target="_blank" rel="noopener">Open in Google Maps</a>
          ${post.description ? `<br>${post.description}` : ''}
        `);

        marker.addTo(group);
        milepostMarkers.push(marker);
      });

      group.addTo(map);
      layerItems.push({
        label: `Mile posts KMZ (${milePosts.length})`,
        layer: group,
        color: '#ffeb3b',
        borderColor: '#8a2be2',
        type: 'point'
      });
      group.eachLayer(extendBounds);
      group.eachLayer((layer) => {
        if (layer.bringToFront) layer.bringToFront();
      });
      return group;
    }

    function folderNameFromListEntry(entry) {
      return entry
        .trim()
        .replace(/^data\/text_info\//, '')
        .replace(/\.txt$/i, '');
    }

    function labelFromFolderName(folderName) {
      const match = folderName.match(/(?:^|_)(\d{8})_(\d{6})(?:_|$)/);

      if (!match) {
        return folderName.split('_')[0] || folderName;
      }

      const [, date, time] = match;
      return `${date.slice(0, 4)}-${date.slice(4, 6)}-${date.slice(6, 8)} ${time.slice(0, 2)}:${time.slice(2, 4)}:${time.slice(4, 6)}`;
    }

    async function loadMarkerDirectoryList(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Could not load ${url}: ${response.status}`);
      }

      return (await response.text())
        .split(/\r?\n/)
        .map(folderNameFromListEntry)
        .filter(Boolean);
    }

    async function loadMarkerTrack({ url, label, color }) {
      const response = await fetch(url);
      if (!response.ok) {
        console.warn(`Skipping ${url}: ${response.status}`);
        return null;
      }

      const rows = parseMarkerText(await response.text());
      const group = L.layerGroup();
      const latLngs = rows.map((row) => [row.lat, row.lon]);

      if (latLngs.length > 1) {
        L.polyline(latLngs, {
          color,
          opacity: 0.82,
          weight: 4
        }).addTo(group);
      }

      rows.forEach((row, index) => {
        const marker = L.circleMarker([row.lat, row.lon], {
          color,
          fillColor: color,
          fillOpacity: 0.75,
          radius: index % 10 === 0 ? 4 : 2,
          weight: 1
        });

        marker.bindPopup(`
          <strong>${label}</strong><br>
          ${row.imageFile}<br>
          ${row.time}<br>
          ${row.lat.toFixed(7)}, ${row.lon.toFixed(7)}<br>
          Elevation: ${Number.isFinite(row.ele) ? row.ele.toFixed(2) : 'n/a'}
        `);

        marker.addTo(group);
      });

      group.addTo(map);
      layerItems.push({
        label: `${label} (${rows.length})`,
        layer: group,
        color,
        type: 'line'
      });
      group.eachLayer(extendBounds);
      milepostMarkers.forEach((marker) => marker.bringToFront());
      return group;
    }

    function updateMilepostLabels() {
      const showLabels = map.getZoom() >= 15;
      milepostMarkers.forEach((marker) => {
        if (!map.hasLayer(marker)) return;
        if (showLabels) {
          marker.openTooltip();
        } else {
          marker.closeTooltip();
        }
      });
    }

    function addLayerPanel() {
      const panel = L.control({ position: 'topright' });
      panel.onAdd = function () {
        const div = L.DomUtil.create('div', 'layer-panel');
        const rows = layerItems.map((item, index) => {
          const marker = item.type === 'line'
            ? `<span class="legend-line" style="background:${item.color}"></span>`
            : `<span class="legend-swatch" style="background:${item.color};border:2px solid ${item.borderColor || item.color}"></span>`;

          return `
            <label class="layer-row" title="${item.label}">
              <input type="checkbox" checked data-layer-index="${index}">
              ${marker}
              <span class="layer-label">${item.label}</span>
            </label>
          `;
        }).join('');

        div.innerHTML = `<div class="panel-title">Layers</div>${rows}`;
        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.disableScrollPropagation(div);
        div.addEventListener('change', (event) => {
          const checkbox = event.target.closest('input[data-layer-index]');
          if (!checkbox) return;

          const item = layerItems[Number(checkbox.dataset.layerIndex)];
          if (checkbox.checked) {
            item.layer.addTo(map);
            item.layer.eachLayer((layer) => {
              if (layer.options && layer.options.pane === 'milepostPane' && layer.bringToFront) {
                layer.bringToFront();
              }
            });
          } else {
            map.removeLayer(item.layer);
          }

          updateMilepostLabels();
        });
        return div;
      };
      panel.addTo(map);
    }

    function addInfoPanel() {
      const panel = L.control({ position: 'bottomleft' });
      panel.onAdd = function () {
        const div = L.DomUtil.create('div', 'info-panel');
        div.innerHTML = `
          <div class="panel-title">Rail 360 Data Viewer</div>
          <p class="panel-text">
            The colored trajectories show GPS positions recorded by a 360 camera mounted on a train. Each point represents a video frame location along the run.
          </p>
          <p class="panel-text">
            Mile markers are fixed railway reference posts used to locate assets and events along a rail corridor. Click a marker or trajectory point for details; zoom in to show mile marker labels.
          </p>
          <div class="panel-footer">MassDOT Rail & Transit | UMass Lowell</div>
        `;
        L.DomEvent.disableClickPropagation(div);
        return div;
      };
      panel.addTo(map);
    }

    async function init() {
      const markerFolders = await loadMarkerDirectoryList('data/text_info/data_dir_list.txt');
      const markerLoads = markerFolders.map((folderName, index) => loadMarkerTrack({
        url: `data/${folderName}/markers.txt`,
        label: labelFromFolderName(folderName),
        color: trackColors[index % trackColors.length]
      }));

      await loadMilePostsKmz('data/Mile_Posts.kmz');
      await Promise.all(markerLoads);
      milepostMarkers.forEach((marker) => marker.bringToFront());

      addLayerPanel();
      addInfoPanel();
      fitToData();
      updateMilepostLabels();
      map.on('zoomend layeradd layerremove', updateMilepostLabels);
      map.removeControl(status);
    }

    init().catch((error) => {
      console.error(error);
      status.getContainer().textContent = error.message;
    });
  </script>
</body>
</html>
