<!DOCTYPE html>
<!--
    360 Image Viewer and GPS Map
    Version 6.6

    Difference from previous version:
    - Shows a red/maroon rectangle on SITE OF RECORDING map indicating the initial view bounds of TRACK MAP.
    - Loads GPS data from markers.txt if available (faster), falls back to EXIF reading if not found.
    - Adds Auto-play / Pause button between Previous and Next.
    - Adds speed control, default 3 images per second.
    - Keeps the existing Pannellum scene switching and panorama preloading.
    - Keeps GPS duplicate skipping enabled by default.
    - Keeps sorted image-path list available in code, hidden by default.
    - Shows TRACK MAP as a blue polyline instead of visible blue point circles.
    - Shows the current GPS location as a larger red circle with a permanent GPS label.
-->
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>360 Image Viewer and GPS Map - v6.6</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
    />

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css"
    />

    <style>
        main {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            display: flex;

            margin: 3em 0 1em 0;

        body {

            background: rgb(2, 0, 36);
            background: linear-gradient(
                0deg,
                rgba(2, 0, 36, 1) 0%,
                rgba(46, 46, 46, 1) 100%
            );
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .version-note {
            margin-bottom: 2em;
            padding: 0.9em 1.1em;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 0.5em;

        #stepSize,

        button {

        #viewer {
            height: 400px;

        .test-block {

        select {

<body>
    <main>

        <!--

<div id="gpsInfo" class="version-note">No image loaded.</div>

        <!--

    <script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>

    <script>
        "use strict";

        /*
            Page version.
        */
        const VIEWER_VERSION = "6.6";

        /*
            Main data source.
            This file contains paths to dataset text files.
        */
        const DATA_DIR_LIST_PATH = "data/text_info/data_dir_list.txt";

        /*
            Sort image paths before reading GPS EXIF.
            If duplicate GPS points are skipped, the first image in sorted order is kept.
        */
        const SORT_IMAGE_PATHS = true;

        /*
            True by default:
            after sorting and reading GPS EXIF, if multiple images have the same
            GPS coordinate, only the first one is kept.
        */
        const SKIP_DUPLICATE_GPS_POINTS = true;

        /*
            Used only when SKIP_DUPLICATE_GPS_POINTS is true.

            7 decimal places is strict.
            If your GPS values differ slightly even when they are basically the same point,
            try 6 or 5.
        */
        const DUPLICATE_GPS_DECIMAL_PLACES = 7;

        /*
            False by default, because you did not want the file list visible below the maps.
            The sorted list is still created internally.
        */
        const SHOW_SORTED_FILE_LIST = false;

        /*
            Panorama preloading settings.
            These reduce the short Pannellum "loading" flash when clicking next/previous
            and help auto-play feel smoother.
        */
        const PRELOAD_PANORAMA_IMAGES = true;
        const PRELOAD_FORWARD_COUNT = 15;
        const PRELOAD_BACKWARD_COUNT = 3;

        /*
            If true, the old panorama stays visible until the next one is preloaded.
            If false, it switches immediately, but Pannellum may briefly show loading.
        */
        const WAIT_FOR_PRELOAD_BEFORE_SWITCH = true;

        /*
            Hides the small Pannellum loading box.
            This does not make images load faster; preloading does that.
        */
        const HIDE_PANNELLUM_LOADING_BOX = true;

        /*
            Initial view settings for every panorama.
        */
        const DEFAULT_PANORAMA_YAW = 270;
        const DEFAULT_PANORAMA_PITCH = -10;
        const DEFAULT_PANORAMA_HFOV = 120;

        /*
            If true, next/previous/auto-play keeps your current looking direction.
            If false, every image starts at DEFAULT_PANORAMA_YAW/PITCH/HFOV.
        */
        const PRESERVE_VIEW_WHEN_SWITCHING = false;

        /*
            Auto-play settings.
            Default is 6 images per second.
            Lowest speed is 1 image/sec; max speed is 12 images/sec.
        */
        const AUTOPLAY_DEFAULT_IMAGES_PER_SECOND = 4;
        const AUTOPLAY_MIN_IMAGES_PER_SECOND = 1;
        const AUTOPLAY_MAX_IMAGES_PER_SECOND = 12;
        const AUTOPLAY_SPEED_STEP = 1;

        const IMAGE_EXTENSIONS = /\.(jpe?g|png)$/i;
        const EXIF_READ_CONCURRENCY = 8;

        let currentIndex = 0;
        let uniquePoints = [];
        let markers = [];
        let map = null;
        let map2 = null;
        let marker2 = null;
        let boundaryRectangle = null; // Red rectangle showing track map bounds on site map
        let panoramaViewer = null;

        let sortedImagePaths = [];
        let preloadPromises = new Map();
        let showImageRequestId = 0;

        let autoplayRunning = false;
        let autoplayTimer = null;
        let autoplayGeneration = 0;

        /*
            Blue line and current-location marker for TRACK MAP.
        */
        let trackPolyline = null;
        let currentLocationMarker = null;

        if (HIDE_PANNELLUM_LOADING_BOX) {
            document.documentElement.classList.add("hide-pannellum-loader");
        }

        const blueDotIcon = L.divIcon({
            className: "blue-dot",
            iconSize: [8, 8],
            iconAnchor: [4, 4],
            popupAnchor: [0, -5],
        });

        const trackClickTargetIcon = L.divIcon({
            className: "track-click-target",
            iconSize: [18, 18],
            iconAnchor: [9, 9],
            popupAnchor: [0, -9],
        });

        const currentDotIcon = L.divIcon({
            className: "current-dot",
            iconSize: [22, 22],
            iconAnchor: [11, 11],
            popupAnchor: [0, -11],
        });

        function setStatus(message){
const s=document.getElementById("status");
s.textContent=message||"";
s.style.display=message?"block":"none";
}

        function setNavigationDisabled(disabled) {
            document.getElementById("prevButton").disabled = disabled;
            document.getElementById("nextButton").disabled = disabled;
            document.getElementById("prevXButton").disabled = disabled;
            document.getElementById("nextXButton").disabled = disabled;
            document.getElementById("playPauseButton").disabled = disabled;
            document.getElementById("autoplayFps").disabled = disabled;
        }

        function normalizeWebPath(path) {
            return String(path).trim().replace(/\\/g, "/");
        }

        function pathToUrl(path) {
            return normalizeWebPath(path)
                .split("/")
                .map(part => encodeURIComponent(part))
                .join("/");
        }

        function getBaseName(path) {
            const normalized = normalizeWebPath(path);
            return normalized.split("/").pop();
        }

        function getDatasetLabel(txtFilePath) {
            const baseName = getBaseName(txtFilePath).replace(/\.txt$/i, "");
            const parts = baseName.split("_");

            /*
                Expected example:
                LRV_20240815_083847_01_014-GPS-frames-1_SEC-CSV-small

                parts[0] = LRV
                parts[1] = 20240815
                parts[2] = 083847
            */
            if (parts.length >= 3) {
                const datePart = parts[1];
                const timePart = parts[2];

                const validDate = /^\d{8}$/.test(datePart);
                const validTime = /^\d{6}$/.test(timePart);

                if (validDate && validTime) {
                    const year = datePart.slice(0, 4);
                    const month = datePart.slice(4, 6);
                    const day = datePart.slice(6, 8);

                    const hour = timePart.slice(0, 2);
                    const minute = timePart.slice(2, 4);
                    const second = timePart.slice(4, 6);

                    return `${year}-${month}-${day} ${hour}:${minute}:${second}`;
                }
            }

            return baseName;
        }

        function isHiddenPath(path) {
            const parts = normalizeWebPath(path).split("/");

            return parts.some(part => {
                if (!part || part === "." || part === "..") {
                    return false;
                }

                return part.startsWith(".") || part.startsWith("._");
            });
        }

        function isAllowedImagePath(path) {
            const name = getBaseName(path);

            if (!IMAGE_EXTENSIONS.test(name)) {
                return false;
            }

            if (name.startsWith(".") || name.startsWith("._")) {
                return false;
            }

            return !isHiddenPath(path);
        }

        function parseTextList(text) {
            return text
                .split(/\r?\n/)
                .map(line => normalizeWebPath(line))
                .filter(line => line.length > 0)
                .filter(line => !line.startsWith("#"));
        }

        async function fetchTextFile(path) {
            const response = await fetch(pathToUrl(path), {
                cache: "no-store",
            });

            if (!response.ok) {
                throw new Error(
                    `Could not read ${path}. HTTP ${response.status} ${response.statusText}`
                );
            }

            return response.text();
        }

        function rationalToNumber(value) {
            if (typeof value === "number") {
                return value;
            }

            if (typeof value === "string") {
                return Number(value);
            }

            if (
                value &&
                typeof value === "object" &&
                "numerator" in value &&
                "denominator" in value
            ) {
                if (value.denominator === 0) {
                    return NaN;
                }

                return value.numerator / value.denominator;
            }

            return NaN;
        }

        function gpsDMSToDecimal(dms, ref) {
            if (!Array.isArray(dms) || dms.length < 3) {
                return null;
            }

            const degrees = rationalToNumber(dms[0]);
            const minutes = rationalToNumber(dms[1]);
            const seconds = rationalToNumber(dms[2]);

            if (
                !Number.isFinite(degrees) ||
                !Number.isFinite(minutes) ||
                !Number.isFinite(seconds)
            ) {
                return null;
            }

            let decimal = degrees + minutes / 60 + seconds / 3600;
            const direction = String(ref || "").trim().toUpperCase();

            if (direction === "S" || direction === "W") {
                decimal *= -1;
            }

            return decimal;
        }

        async function readGpsFromImage(imagePath) {
            /*
                Do not use cache: "no-store" here.
                The image bytes downloaded for EXIF can also help the browser cache
                when Pannellum later loads the same panorama.
            */
            const response = await fetch(pathToUrl(imagePath), {
                cache: "force-cache",
            });

            if (!response.ok) {
                throw new Error(
                    `Could not read image ${imagePath}. HTTP ${response.status} ${response.statusText}`
                );
            }

            const buffer = await response.arrayBuffer();
            const tags = EXIF.readFromBinaryFile(buffer) || {};

            const lat = gpsDMSToDecimal(tags.GPSLatitude, tags.GPSLatitudeRef);
            const lon = gpsDMSToDecimal(tags.GPSLongitude, tags.GPSLongitudeRef);

            if (lat === null || lon === null) {
                return null;
            }

            return {
                name: getBaseName(imagePath),
                path: imagePath,
                imageSrc: pathToUrl(imagePath),
                lat,
                lon,
            };
        }

        /**
         * Parse markers.txt CSV file
         * Format: image_file,lat,lon,ele,time
         * Example: frame_00000000.jpg,42.6670102224114,-72.5282775556126,120.078737647273,2024-08-15 13:07:57
         */
        function parseMarkersTxt(text, imageDirectory) {
            const lines = text.trim().split(/\r?\n/);
            const markers = [];
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                // Skip empty lines and header
                if (!line || line.startsWith('image_file')) {
                    continue;
                }
                
                const parts = line.split(',');
                if (parts.length < 3) {
                    continue;
                }
                
                const imageFile = parts[0].trim();
                const lat = parseFloat(parts[1]);
                const lon = parseFloat(parts[2]);
                
                if (isNaN(lat) || isNaN(lon)) {
                    continue;
                }
                
                // Build full path
                const imagePath = normalizeWebPath(imageDirectory + '/' + imageFile);
                
                markers.push({
                    name: imageFile,
                    path: imagePath,
                    imageSrc: pathToUrl(imagePath),
                    lat,
                    lon,
                });
            }
            
            return markers;
        }

        /**
         * Try to load GPS data from markers.txt, fall back to EXIF reading if not found
         */
        async function loadGpsData(imagePaths, datasetDirectory) {
            // Determine the directory containing the images
            // If imagePaths[0] is "data/folder/image.jpg", directory is "data/folder"
            let imageDirectory = '';
            if (imagePaths.length > 0) {
                const firstPath = normalizeWebPath(imagePaths[0]);
                const lastSlash = firstPath.lastIndexOf('/');
                if (lastSlash >= 0) {
                    imageDirectory = firstPath.substring(0, lastSlash);
                }
            }
            
            // Try to load markers.txt from the same directory as the images
            if (imageDirectory) {
                const markersTxtPath = normalizeWebPath(imageDirectory + '/markers.txt');
                
                try {
                    setStatus(`Trying to load GPS data from ${markersTxtPath}...`);
                    const text = await fetchTextFile(markersTxtPath);
                    const markers = parseMarkersTxt(text, imageDirectory);
                    
                    if (markers.length > 0) {
                        setStatus(`Loaded GPS data from ${markersTxtPath} for ${markers.length} images.`);
                        
                        // Build a lookup map for quick access
                        const markerMap = new Map();
                        markers.forEach(marker => {
                            markerMap.set(marker.name, marker);
                        });
                        
                        // Match markers to imagePaths
                        const gpsPoints = [];
                        for (const imagePath of imagePaths) {
                            const imageName = getBaseName(imagePath);
                            const marker = markerMap.get(imageName);
                            
                            if (marker) {
                                gpsPoints.push({
                                    name: imageName,
                                    path: imagePath,
                                    imageSrc: pathToUrl(imagePath),
                                    lat: marker.lat,
                                    lon: marker.lon,
                                });
                            }
                        }
                        
                        return {
                            points: gpsPoints,
                            source: 'markers.txt',
                        };
                    }
                } catch (error) {
                    // markers.txt not found or error reading it, fall back to EXIF
                    console.log(`markers.txt not found or could not be read: ${error.message}`);
                }
            }
            
            // Fall back to reading EXIF from images
            setStatus(`Reading GPS EXIF from ${imagePaths.length} image(s)...`);
            
            const rawPoints = await mapWithConcurrency(
                imagePaths,
                EXIF_READ_CONCURRENCY,
                readGpsFromImage,
                (finished, total) => {
                    setStatus(`Reading GPS EXIF: ${finished}/${total}`);
                }
            );
            
            const gpsPoints = rawPoints.filter(Boolean);
            
            return {
                points: gpsPoints,
                source: 'EXIF',
            };
        }

        async function mapWithConcurrency(items, limit, mapper, onProgress) {
            const results = new Array(items.length);
            let nextIndex = 0;
            let finished = 0;

            async function worker() {
                while (nextIndex < items.length) {
                    const index = nextIndex;
                    nextIndex += 1;

                    try {
                        results[index] = await mapper(items[index], index);
                    } catch (error) {
                        console.warn(error);
                        results[index] = null;
                    }

                    finished += 1;

                    if (onProgress) {
                        onProgress(finished, items.length);
                    }
                }
            }

            const workerCount = Math.min(limit, items.length);
            const workers = Array.from({ length: workerCount }, worker);

            await Promise.all(workers);

            return results;
        }

        function makeDuplicateGpsKey(point) {
            return [
                point.lat.toFixed(DUPLICATE_GPS_DECIMAL_PLACES),
                point.lon.toFixed(DUPLICATE_GPS_DECIMAL_PLACES),
            ].join(",");
        }

        function filterDuplicateGpsPoints(points) {
            if (!SKIP_DUPLICATE_GPS_POINTS) {
                return {
                    points,
                    skippedDuplicateCount: 0,
                };
            }

            const seen = new Set();
            const filtered = [];
            let skippedDuplicateCount = 0;

            for (const point of points) {
                const key = makeDuplicateGpsKey(point);

                if (seen.has(key)) {
                    skippedDuplicateCount += 1;
                    continue;
                }

                seen.add(key);
                filtered.push(point);
            }

            return {
                points: filtered,
                skippedDuplicateCount,
            };
        }

        function resetBox(id, message) {
            const element = document.getElementById(id);
            element.className = "test-block";
            element.innerHTML = `<p class="test-item footnote">${message}</p>`;
        }

        function prepareMapBox(id) {
            const element = document.getElementById(id);
            element.className = "";
            element.innerHTML = "";
        }

        function clear() {
            stopAutoplay();

            uniquePoints = [];
            sortedImagePaths = [];
            markers = [];
            currentIndex = 0;
            marker2 = null;
            trackPolyline = null;
            currentLocationMarker = null;
            boundaryRectangle = null;

            preloadPromises.clear();
            showImageRequestId += 1;

            if (panoramaViewer && typeof panoramaViewer.destroy === "function") {
                panoramaViewer.destroy();
            }

            panoramaViewer = null;

            if (map) {
                map.remove();
                map = null;
            }

            if (map2) {
                map2.remove();
                map2 = null;
            }

            resetBox("viewer", "No preview available");
            resetBox("map", "Map data unavailable");
            resetBox("map2", "Map data unavailable");

            const sortedFilesList = document.getElementById("sortedFilesList");

            if (sortedFilesList) {
                sortedFilesList.innerHTML = "";
                sortedFilesList.hidden = !SHOW_SORTED_FILE_LIST;
            }

            setNavigationDisabled(true);
            updatePlayPauseButton();
        }

        async function loadDatasetDropdown() {
            const dropdown = document.getElementById("dropdown");

            try {
                setStatus(`Loading ${DATA_DIR_LIST_PATH}...`);

                const text = await fetchTextFile(DATA_DIR_LIST_PATH);

                const datasetTxtFiles = parseTextList(text)
                    .filter(path => /\.txt$/i.test(path))
                    .filter(path => !isHiddenPath(path));

                dropdown.innerHTML = "";

                const defaultOption = document.createElement("option");
                defaultOption.value = "-";
                defaultOption.textContent = "Choose dataset";
                dropdown.appendChild(defaultOption);

                for (const txtFilePath of datasetTxtFiles) {
                    const option = document.createElement("option");
                    option.value = txtFilePath;
                    option.textContent = getDatasetLabel(txtFilePath);

                    /*
                        Full path visible on hover.
                    */
                    option.title = txtFilePath;

                    dropdown.appendChild(option);
                }

                setStatus(
                    `Loaded ${datasetTxtFiles.length} dataset list file(s) from ${DATA_DIR_LIST_PATH}.`
                );
            } catch (error) {
                console.error(error);

                dropdown.innerHTML = "";

                const option = document.createElement("option");
                option.value = "-";
                option.textContent = "Could not load dataset list";
                dropdown.appendChild(option);

                setStatus(error.message);
            }
        }

        async function changeDataset(datasetListTxtPath) {
            if (datasetListTxtPath === "-") {
                clear();
                setStatus("");
                return;
            }

            clear();

            try {
                setStatus(`Loading image list: ${datasetListTxtPath}`);

                const text = await fetchTextFile(datasetListTxtPath);

                let imagePaths = parseTextList(text)
                    .filter(isAllowedImagePath);

                if (SORT_IMAGE_PATHS) {
                    imagePaths = imagePaths.sort((a, b) =>
                        a.localeCompare(b, undefined, { numeric: true })
                    );
                }

                sortedImagePaths = imagePaths.slice();
                renderSortedFileList(sortedImagePaths);

                if (imagePaths.length === 0) {
                    setStatus(`No jpg/png image paths found in ${datasetListTxtPath}.`);
                    return;
                }

                // Load GPS data from markers.txt or EXIF
                const gpsResult = await loadGpsData(imagePaths, datasetListTxtPath);
                const gpsPoints = gpsResult.points;
                const gpsSource = gpsResult.source;
                
                const duplicateResult = filterDuplicateGpsPoints(gpsPoints);

                uniquePoints = duplicateResult.points;

                if (uniquePoints.length === 0) {
                    setStatus(
                        `No GPS coordinates found. Checked ${imagePaths.length} image(s) using ${gpsSource}.`
                    );
                    return;
                }

                /*
                    Start warming the first group of panoramas before the first view appears.
                */
                preloadAroundIndex(0);

                initMap1();
                initMap2();
                generateMarkers();

                setNavigationDisabled(false);
                updatePlayPauseButton();

                await showImage(0);

                const noGpsCount = imagePaths.length - gpsPoints.length;
                const duplicateCount = duplicateResult.skippedDuplicateCount;

                setStatus(
                    `Loaded ${uniquePoints.length} GPS point(s) from ${gpsSource}. ` +
                    `${noGpsCount} image(s) had no GPS data. ` +
                    `${duplicateCount} duplicate GPS point(s) skipped. ` +
                    `Showing 1/${uniquePoints.length}: ${uniquePoints[0].path}`
                );
            } catch (error) {
                console.error(error);
                clear();
                setStatus(error.message);
            }
        }

        function renderSortedFileList(imagePaths) {
            const list = document.getElementById("sortedFilesList");

            if (!list) {
                return;
            }

            list.innerHTML = "";
            list.hidden = !SHOW_SORTED_FILE_LIST;

            if (!SHOW_SORTED_FILE_LIST) {
                return;
            }

            for (const imagePath of imagePaths) {
                const item = document.createElement("li");
                item.textContent = imagePath;
                list.appendChild(item);
            }
        }

        function initMap1() {
            prepareMapBox("map");

            map = L.map("map").setView([0, 0], 2);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 18,
            }).addTo(map);
        }

        function initMap2() {
            prepareMapBox("map2");

            const firstPoint = uniquePoints[0];

            map2 = L.map("map2", {
                center: [firstPoint.lat, firstPoint.lon],
                zoom: 8,
                zoomControl: false,
                scrollWheelZoom: false,
                doubleClickZoom: false,
                keyboard: false,
            });

            L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
                maxZoom: 19,
                attribution:
                    '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            }).addTo(map2);

            marker2 = L.marker([firstPoint.lat, firstPoint.lon]);
            marker2.addTo(map2).bindPopup("Location of recording.").openPopup();
        }

        function generateMarkers() {
            const latLngs = uniquePoints.map(point => [point.lat, point.lon]);

            if (latLngs.length > 1) {
                trackPolyline = L.polyline(latLngs, {
                    color: "rgb(34, 34, 250)",
                    weight: 4,
                    opacity: 0.9,
                    smoothFactor: 1,
                    lineCap: "round",
                    lineJoin: "round",
                }).addTo(map);
            }

            /*
                Invisible markers preserve click-to-select behavior at each GPS point
                without drawing visible blue circles.
            */
            markers = uniquePoints.map((point, index) => {
                const marker = L.marker([point.lat, point.lon], {
                    icon: trackClickTargetIcon,
                    pointIndex: index,
                    keyboard: false,
                    title: `GPS point ${index + 1}`,
                })
                    .on("click", () => {
                        showImage(index);
                    })
                    .addTo(map)
                    .bindPopup(
                        `${escapeHtml(point.name)}<br>` +
                        `Latitude: ${point.lat}<br>` +
                        `Longitude: ${point.lon}`
                    );

                return marker;
            });

            if (latLngs.length === 1) {
                map.setView([uniquePoints[0].lat, uniquePoints[0].lon], 18);
            } else if (trackPolyline) {
                map.fitBounds(trackPolyline.getBounds(), {
                    padding: [20, 20],
                });
            }
            
            // Draw red boundary rectangle on map2 showing the initial bounds of map (TRACK MAP)
            drawBoundaryRectangleOnMap2();

            setTimeout(() => {
                map.invalidateSize();

                if (map2) {
                    map2.invalidateSize();
                }
            }, 0);
        }
        
        /**
         * Draw a red/maroon rectangle on map2 (SITE OF RECORDING) 
         * showing the initial view bounds of map (TRACK MAP)
         */
        function drawBoundaryRectangleOnMap2() {
            if (!map || !map2) {
                return;
            }
            
            // Remove existing rectangle if any
            if (boundaryRectangle) {
                map2.removeLayer(boundaryRectangle);
                boundaryRectangle = null;
            }
            
            // Get the current bounds of map (TRACK MAP)
            const bounds = map.getBounds();
            
            if (!bounds) {
                return;
            }
            
            // Draw a rectangle with these bounds on map2
            boundaryRectangle = L.rectangle(bounds, {
                color: "maroon",
                fillColor: "maroon",
                fillOpacity: 0.15,
                weight: 2,
                opacity: 0.7,
            }).addTo(map2);
            
            // Optionally add a popup to the rectangle
            boundaryRectangle.bindPopup("Track Map Region");
        }

        function getSceneId(index) {
            return `scene_${index}`;
        }

        function buildPannellumScenes() {
            const scenes = {};

            uniquePoints.forEach((point, index) => {
                scenes[getSceneId(index)] = {
                    type: "equirectangular",
                    panorama: point.imageSrc,
                    yaw: DEFAULT_PANORAMA_YAW,
                    pitch: DEFAULT_PANORAMA_PITCH,
                    hfov: DEFAULT_PANORAMA_HFOV,
                };
            });

            return scenes;
        }

        function initPanoramaViewer(initialIndex = 0) {
            const viewerElement = document.getElementById("viewer");

            viewerElement.className = "";
            viewerElement.innerHTML = "";

            panoramaViewer = pannellum.viewer("viewer", {
                autoLoad: true,

                default: {
                    firstScene: getSceneId(initialIndex),
                    sceneFadeDuration: 0,
                    autoLoad: true,
                },

                scenes: buildPannellumScenes(),
            });
        }

        function preloadImage(url) {
            if (!PRELOAD_PANORAMA_IMAGES) {
                return Promise.resolve();
            }

            if (preloadPromises.has(url)) {
                return preloadPromises.get(url);
            }

            const promise = new Promise(resolve => {
                const img = new Image();

                img.decoding = "async";

                img.onload = async () => {
                    try {
                        if (img.decode) {
                            await img.decode();
                        }
                    } catch (error) {
                        /*
                            decode() can fail in some browser/image combinations.
                            The image has still loaded, so continue.
                        */
                    }

                    resolve();
                };

                img.onerror = () => {
                    /*
                        Do not block navigation forever if an image fails.
                        Pannellum will still try to load it.
                    */
                    resolve();
                };

                img.src = url;
            });

            preloadPromises.set(url, promise);

            return promise;
        }

        function preloadAroundIndex(index) {
            if (!PRELOAD_PANORAMA_IMAGES || uniquePoints.length === 0) {
                return;
            }

            const start = Math.max(0, index - PRELOAD_BACKWARD_COUNT);
            const end = Math.min(
                uniquePoints.length - 1,
                index + PRELOAD_FORWARD_COUNT
            );

            for (let i = start; i <= end; i++) {
                preloadImage(uniquePoints[i].imageSrc);
            }
        }

        async function showImage(index) {
            if (uniquePoints.length === 0) {
                return;
            }

            const targetIndex = Math.max(0, Math.min(index, uniquePoints.length - 1));
            const point = uniquePoints[targetIndex];

            /*
                Update immediately so fast repeated next/previous clicks keep moving.
            */
            currentIndex = targetIndex;

            /*
                Ignore old async calls if the user clicks again quickly.
            */
            const requestId = ++showImageRequestId;

            /*
                Warm nearby images as soon as possible.
            */
            preloadAroundIndex(targetIndex);

            if (WAIT_FOR_PRELOAD_BEFORE_SWITCH) {
                //setStatus(
                //    `Preparing ${targetIndex + 1}/${uniquePoints.length}: ${point.path}`
                //);

                await preloadImage(point.imageSrc);

                if (requestId !== showImageRequestId) {
                    return;
                }
            }

            if (!panoramaViewer) {
                initPanoramaViewer(targetIndex);
            } else {
                const sceneId = getSceneId(targetIndex);
                const currentScene =
                    typeof panoramaViewer.getScene === "function"
                        ? panoramaViewer.getScene()
                        : null;

                if (currentScene !== sceneId) {
                    let pitch = DEFAULT_PANORAMA_PITCH;
                    let yaw = DEFAULT_PANORAMA_YAW;
                    let hfov = DEFAULT_PANORAMA_HFOV;

                    if (PRESERVE_VIEW_WHEN_SWITCHING) {
                        pitch = panoramaViewer.getPitch();
                        yaw = panoramaViewer.getYaw();
                        hfov = panoramaViewer.getHfov();
                    }

                    panoramaViewer.loadScene(sceneId, pitch, yaw, hfov);
                }
            }

            highlightMarker(targetIndex);

            if (map) {
                map.panTo([point.lat, point.lon], {
                    animate: true,
                });
            }

            preloadAroundIndex(targetIndex);

            updateGpsInfo(point,targetIndex);
            updateGpsLabelVisibility();
            // setStatus(`Showing ${targetIndex + 1}/${uniquePoints.length}: ${point.name}`); / Leave the status area unchanged during navigation.
            setStatus(``);
        }

        function getCurrentGpsTooltipHtml(point) {
            return (
                `GPS Location<br>` +
                `Latitude: ${point.lat.toFixed(7)}<br>` +
                `Longitude: ${point.lon.toFixed(7)}`
            );
        }

        function highlightMarker(index) {
            const point = uniquePoints[index];

            if (!point || !map) {
                return;
            }

            if (!currentLocationMarker) {
                currentLocationMarker = L.marker([point.lat, point.lon], {
                    icon: currentDotIcon,
                    interactive: true,
                    zIndexOffset: 1000,
                }).addTo(map);
            } else {
                currentLocationMarker.setLatLng([point.lat, point.lon]);
                currentLocationMarker.setIcon(currentDotIcon);
            }

            currentLocationMarker.unbindTooltip();
            currentLocationMarker.unbindPopup();

            currentLocationMarker
                .bindTooltip(getCurrentGpsTooltipHtml(point), {
                    permanent: true,
                    direction: "top",
                    offset: [0, -14],
                    opacity: 1,
                    className: "current-gps-tooltip",
                })
                .openTooltip();

            currentLocationMarker.bindPopup(
                `${escapeHtml(point.name)}<br>` +
                `Latitude: ${point.lat}<br>` +
                `Longitude: ${point.lon}`
            );
        }

        function showNextImage() {
            showImage(currentIndex + 1);
        }

        function showPreviousImage() {
            showImage(currentIndex - 1);
        }

        function showNextXImage() {
            const stepSize =
                parseInt(document.getElementById("stepSize").value, 10) || 5;

            showImage(currentIndex + stepSize);
        }

        function showPreviousXImage() {
            const stepSize =
                parseInt(document.getElementById("stepSize").value, 10) || 5;

            showImage(currentIndex - stepSize);
        }

        function initializeAutoplaySpeedInput() {
            const input = document.getElementById("autoplayFps");

            input.min = String(AUTOPLAY_MIN_IMAGES_PER_SECOND);
            input.max = String(AUTOPLAY_MAX_IMAGES_PER_SECOND);
            input.step = String(AUTOPLAY_SPEED_STEP);
            input.value = String(AUTOPLAY_DEFAULT_IMAGES_PER_SECOND);
        }

        function formatFpsValue(value) {
            const rounded = Math.round(value * 100) / 100;

            if (Number.isInteger(rounded)) {
                return String(rounded);
            }

            return String(rounded);
        }

        function getAutoplayFps() {
            const input = document.getElementById("autoplayFps");
            let fps = parseFloat(input.value);

            if (!Number.isFinite(fps) || fps <= 0) {
                fps = AUTOPLAY_DEFAULT_IMAGES_PER_SECOND;
            }

            fps = Math.max(AUTOPLAY_MIN_IMAGES_PER_SECOND, fps);
            fps = Math.min(AUTOPLAY_MAX_IMAGES_PER_SECOND, fps);

            input.value = formatFpsValue(fps);

            return fps;
        }

        function getAutoplayDelayMs() {
            return 1000 / getAutoplayFps();
        }

        function updatePlayPauseButton() {
            const button = document.getElementById("playPauseButton");

            if (!button) {
                return;
            }

            button.textContent = autoplayRunning ? "Pause" : "Play";
            button.setAttribute("aria-pressed", autoplayRunning ? "true" : "false");
            button.title = autoplayRunning ? "Pause auto-play" : "Start auto-play";
        }

        function toggleAutoplay() {
            if (autoplayRunning) {
                stopAutoplay("");
            } else {
                startAutoplay();
            }
        }

        function startAutoplay() {
            if (uniquePoints.length === 0) {
                setStatus("No dataset loaded.");
                return;
            }

            if (currentIndex >= uniquePoints.length - 1) {
                /*
                    If user presses Play while already at the last image,
                    restart auto-play from the beginning.
                */
                currentIndex = -1;
            }

            autoplayRunning = true;
            autoplayGeneration += 1;

            const generation = autoplayGeneration;
            const fps = getAutoplayFps();

            updatePlayPauseButton();
            //setStatus(`Auto-play started at ${fps} images/sec.`);
            setStatus(``);

            runAutoplayLoop(generation);
        }

        function stopAutoplay(message = "") {
            if (autoplayTimer !== null) {
                clearTimeout(autoplayTimer);
                autoplayTimer = null;
            }

            if (autoplayRunning) {
                autoplayGeneration += 1;
            }

            autoplayRunning = false;
            updatePlayPauseButton();

            if (message) {
                setStatus(message);
            }
        }

        async function runAutoplayLoop(generation) {
            if (!autoplayRunning || generation !== autoplayGeneration) {
                return;
            }

            if (uniquePoints.length === 0) {
                stopAutoplay("Auto-play stopped because no dataset is loaded.");
                return;
            }

            if (currentIndex >= uniquePoints.length - 1) {
                const point = uniquePoints[uniquePoints.length - 1];

                //stopAutoplay(
                //    `Auto-play finished at ${uniquePoints.length}/${uniquePoints.length}: ${point.path}`
                //);
                stopAutoplay();
                return;
            }

            const delayMs = getAutoplayDelayMs();
            const startedAt = performance.now();

            await showImage(currentIndex + 1);

            if (!autoplayRunning || generation !== autoplayGeneration) {
                return;
            }

            if (currentIndex >= uniquePoints.length - 1) {
                const point = uniquePoints[currentIndex];

                //stopAutoplay(
                //    `Auto-play finished at ${currentIndex + 1}/${uniquePoints.length}: ${point.path}`
                //);

                return;
            }

            const elapsedMs = performance.now() - startedAt;
            const nextDelayMs = Math.max(0, delayMs - elapsedMs);

            autoplayTimer = setTimeout(() => {
                runAutoplayLoop(generation);
            }, nextDelayMs);
        }

        function handleAutoplaySpeedChange() {
            const fps = getAutoplayFps();

            if (autoplayRunning) {
                //setStatus(`Auto-play speed changed to ${fps} images/sec.`);
                setStatus(``);
            }
        }


        function updateGpsInfo(point,index){
            const el=document.getElementById("gpsInfo");
            if(!el||!point)return;
            el.innerHTML=`<strong>${index+1}/${uniquePoints.length}</strong>&nbsp;&nbsp;${escapeHtml(point.name)}&nbsp;&nbsp;Lat: ${point.lat.toFixed(7)}&nbsp;&nbsp;Lon: ${point.lon.toFixed(7)}`;
        }

        function updateGpsLabelVisibility(){
            const show=document.getElementById("toggleGpsLabel")?.checked;
            if(currentLocationMarker){
                if(show){currentLocationMarker.openTooltip();}
                else{currentLocationMarker.closeTooltip();}
            }
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document
            .getElementById("dropdown")
            .addEventListener("change", event => changeDataset(event.target.value));

        document
            .getElementById("nextButton")
            .addEventListener("click", showNextImage);

        document
            .getElementById("prevButton")
            .addEventListener("click", showPreviousImage);

        document
            .getElementById("nextXButton")
            .addEventListener("click", showNextXImage);

        document
            .getElementById("prevXButton")
            .addEventListener("click", showPreviousXImage);

        document
            .getElementById("playPauseButton")
            .addEventListener("click", toggleAutoplay);

        document
            .getElementById("autoplayFps")
            .addEventListener("change", handleAutoplaySpeedChange);

        initializeAutoplaySpeedInput();
        updatePlayPauseButton();
        document.addEventListener("change",e=>{if(e.target&&e.target.id==="toggleGpsLabel")updateGpsLabelVisibility();});
        loadDatasetDropdown();
    </script>
</body>
</html>
